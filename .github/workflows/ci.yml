# Integración continua — sección 13 de ARCHITECTURE.md
#
# Si alguna validación falla, el cambio no se integra.
#
# El orden importa: primero el contenido (es lo que más cambia y lo más barato
# de comprobar), luego las pruebas y por último los tipos, que es el único paso
# que necesita instalar dependencias.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verificar:
    name: Validar, probar y tipar
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Sin dependencias: comprueba de paso que el proyecto arranca en una
      # máquina limpia, que es el compromiso del ADR 0002.
      - name: Validar el contenido
        run: npm run validate

      - name: Pruebas unitarias
        run: npm test

      - name: Instalar dependencias de desarrollo
        run: npm install --no-audit --no-fund

      - name: Verificar tipos
        run: npm run typecheck

  doble-clic:
    name: Se abre con doble clic (file://)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # La propiedad que el ADR 0005 declara requisito. Se comprueba abriendo
      # el archivo con el protocolo file:// —igual que un doble clic— y
      # mirando el DOM ya construido: si los seis marcadores están, la cadena
      # completa funcionó sin servidor.
      - name: Renderizar index.html desde file://
        run: |
          URL="file://$(pwd)/index.html"
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom "$URL" > dom.html
          echo "DOM: $(wc -c < dom.html) bytes"
          PINS=$(grep -o 'poi-pin' dom.html | wc -l)
          echo "marcadores: $PINS"
          if [ "$PINS" -lt 6 ]; then
            echo "::error::index.html no arranca con doble clic (ver docs/adr/0005)"
            exit 1
          fi
          if grep -q 'class="fatal"' dom.html; then
            echo "::error::la aplicación mostró un error fatal bajo file://"
            exit 1
          fi
          echo "Se abre con doble clic."

      - name: Levantar el servidor local
        run: |
          npm start -- 8000 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/ > /dev/null && break
            sleep 0.5
          done
          curl -sf http://localhost:8000/ > /dev/null
          curl -sf http://localhost:8000/public/data/places.js > /dev/null
          curl -sf http://localhost:8000/src/app/main.js > /dev/null
          echo "El servidor local también responde."
