<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04437F" />

    <title>¿Qué es ahí? — Bogotá</title>
    <meta
      name="description"
      content="¿Qué es ahí? / ¿What's there? — Exploración urbana geolocalizada: descubre qué hay cerca de ti en el centro histórico de Bogotá."
    />

    <!-- Tarjeta al compartir el enlace -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="¿Qué es ahí? — Bogotá" />
    <meta
      property="og:description"
      content="Exploración urbana geolocalizada del centro histórico de Bogotá."
    />
    <meta property="og:image" content="logo.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="logo.png" />

    <!-- Cartografía: Leaflet + OpenStreetMap por CDN, con verificación de integridad.
         Pendiente de v0.4: servir la librería desde el propio dominio (ROADMAP.md). -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <link rel="stylesheet" href="src/styles/tokens.css?v=0.3.2" />
    <link rel="stylesheet" href="src/styles/app.css?v=0.3.2" />
  </head>

  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <img
            src="logo.png"
            alt="Logo de ¿Qué es ahí?: un pin de mapa con un signo de interrogación sobre olas de colores"
          />
          <h1>
            ¿Qué es ahí?
            <span class="en">/ ¿What's there?</span>
            <span class="tag">BOGOTÁ · v0.3</span>
          </h1>
        </div>
        <p>Toca un punto del mapa o pregunta por lo que tienes cerca.</p>
        <div class="palette-strip" aria-hidden="true"></div>
      </header>

      <button
        class="menu-toggle"
        id="btnCategorias"
        type="button"
        aria-expanded="false"
        aria-controls="categorias"
        aria-label="Filtrar por categoría. Ahora se muestran todas."
      >
        <span class="bars" aria-hidden="true"></span>
        <span class="badge" aria-hidden="true" hidden></span>
      </button>

      <div class="menu-backdrop" id="categoriasBackdrop"></div>

      <!-- Menú lateral de categorías. Se despliega desde la izquierda; el
           filtro es de selección múltiple y sin nada marcado equivale a todas. -->
      <aside
        class="menu"
        id="categorias"
        aria-label="Filtrar por categoría"
        aria-hidden="true"
      >
        <div class="menu-head">
          <h2>Categorías</h2>
          <button class="close" id="categoriasClose" type="button" aria-label="Cerrar el menú de categorías">×</button>
        </div>

        <p class="menu-summary" id="categoriasResumen" role="status" aria-live="polite">
          Se muestran las siete categorías.
        </p>

        <ul class="category-list" id="categoriasLista"><!-- render dinámico --></ul>

        <div class="menu-foot">
          <button class="reset" id="categoriasReset" type="button" disabled>
            Mostrar todas
          </button>
        </div>
      </aside>

      <div id="map" role="application" aria-label="Mapa del centro histórico de Bogotá"></div>

      <div class="cta-wrap">
        <button
          class="cta"
          id="btnHere"
          type="button"
          aria-label="Buscar el lugar de interés más cercano a mi ubicación"
        >
          <span class="icon" aria-hidden="true">📍</span>
          <span class="spinner" aria-hidden="true"></span>
          <span class="label">¿Qué es ahí?</span>
        </button>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>

      <div class="sheet-backdrop" id="backdrop"></div>

      <aside
        class="sheet"
        id="sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="sheetTitle"
        aria-hidden="true"
      >
        <div class="grabber" aria-hidden="true"></div>
        <button class="close" id="sheetClose" type="button" aria-label="Cerrar ficha">×</button>

        <!-- Encabezado fijo. La fotografía se inserta desde placeSheet.js; si
             no hay ninguna, o no carga, queda el degradado de marca con el
             emoji, que es como se veía antes de que existieran las fotos. -->
        <div class="banner" id="sheetBanner">
          <span class="emoji" id="sheetEmoji" aria-hidden="true">📍</span>
          <h2 id="sheetTitle">—</h2>
        </div>

        <!-- El cuerpo ocupa toda la ficha y reserva el alto del encabezado con
             un padding, de modo que el texto pasa por detrás de la fotografía
             al desplazarse en vez de cortarse contra ella. -->
        <div class="body" id="sheetBody"><!-- render dinámico --></div>
      </aside>
    </div>

    <noscript>
      <p style="padding: 24px; color: #fff; font: 15px/1.5 sans-serif">
        «¿Qué es ahí?» necesita JavaScript para mostrar el mapa y calcular qué tienes cerca.
      </p>
    </noscript>

    <!-- ===================================================================
         Carga de la aplicación.

         Son <script> clásicos, NO módulos ES, y esa es una decisión
         deliberada: los módulos exigen un servidor, y aquí hace falta que
         index.html se pueda abrir con doble clic, sin instalar nada.
         Ver docs/adr/0005-abrir-con-doble-clic-sin-servidor.md

         El precio es que el orden importa. Cada archivo declara de qué
         depende en su cabecera, y QEA.require() falla con un mensaje claro si
         algo se carga antes de tiempo. El orden es: base → datos → tipos →
         utilidades → configuración → servicios → repositorios → presentación
         → arranque.
         =================================================================== -->

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <script src="src/app/namespace.js?v=0.3.2"></script>

    <!-- Capa de persistencia (5.5) -->
    <script src="public/data/places.js?v=0.3.2"></script>

    <!-- Modelo y utilidades -->
    <script src="src/types/place.js?v=0.3.2"></script>
    <script src="src/utils/html.js?v=0.3.2"></script>
    <script src="src/app/config.js?v=0.3.2"></script>

    <!-- Capa de servicios (5.3) -->
    <script src="src/services/geoService.js?v=0.3.2"></script>
    <script src="src/services/locationService.js?v=0.3.2"></script>
    <script src="src/services/categoryService.js?v=0.3.2"></script>

    <!-- Capa de repositorios (5.4) -->
    <script src="src/repositories/placeRepository.js?v=0.3.2"></script>
    <script src="src/repositories/embeddedPlaceRepository.js?v=0.3.2"></script>
    <script src="src/repositories/inMemoryPlaceRepository.js?v=0.3.2"></script>

    <!-- Capa de presentación (5.1) y funcionalidades (5.2) -->
    <script src="src/ui/toast.js?v=0.3.2"></script>
    <script src="src/features/map/mapView.js?v=0.3.2"></script>
    <script src="src/features/categories/categoryMenu.js?v=0.3.2"></script>
    <script src="src/features/places/placeSheet.js?v=0.3.2"></script>
    <script src="src/features/location/whereAmI.js?v=0.3.2"></script>

    <!-- Arranque -->
    <script src="src/app/main.js?v=0.3.2"></script>
  </body>
</html>
