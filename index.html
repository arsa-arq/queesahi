<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04437F" />

    <title>¿Qué es ahí? — Bogotá</title>
    <meta
      name="description"
      content="¿Qué es ahí? / ¿What's there? — Exploración urbana geolocalizada: descubre qué hay cerca de ti en el centro histórico de Bogotá."
    />

    <!-- Tarjeta al compartir el enlace -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="¿Qué es ahí? — Bogotá" />
    <meta
      property="og:description"
      content="Exploración urbana geolocalizada del centro histórico de Bogotá."
    />
    <meta property="og:image" content="logo.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="logo.png" />

    <!-- Cartografía: Leaflet + OpenStreetMap por CDN, con verificación de integridad.
         Pendiente de v0.5: servir la librería desde el propio dominio (ROADMAP.md). -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/app.css" />
  </head>

  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <img
            src="logo.png"
            alt="Logo de ¿Qué es ahí?: un pin de mapa con un signo de interrogación sobre olas de colores"
          />
          <h1>
            ¿Qué es ahí?
            <span class="en">/ ¿What's there?</span>
            <span class="tag">BOGOTÁ · v0.2</span>
          </h1>
        </div>
        <p>Toca un punto del mapa o pregunta por lo que tienes cerca.</p>
        <div class="palette-strip" aria-hidden="true"></div>
      </header>

      <div id="map" role="application" aria-label="Mapa del centro histórico de Bogotá"></div>

      <div class="cta-wrap">
        <button
          class="cta"
          id="btnHere"
          type="button"
          aria-label="Buscar el lugar de interés más cercano a mi ubicación"
        >
          <span class="icon" aria-hidden="true">📍</span>
          <span class="spinner" aria-hidden="true"></span>
          <span class="label">¿Qué es ahí?</span>
        </button>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>

      <div class="sheet-backdrop" id="backdrop"></div>

      <aside
        class="sheet"
        id="sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="sheetTitle"
        aria-hidden="true"
      >
        <div class="grabber" aria-hidden="true"></div>
        <button class="close" id="sheetClose" type="button" aria-label="Cerrar ficha">×</button>
        <div class="banner">
          <span class="emoji" id="sheetEmoji" aria-hidden="true">📍</span>
          <h2 id="sheetTitle">—</h2>
        </div>
        <div class="body" id="sheetBody"><!-- render dinámico --></div>
      </aside>
    </div>

    <noscript>
      <p style="padding: 24px; color: #fff; font: 15px/1.5 sans-serif">
        «¿Qué es ahí?» necesita JavaScript para mostrar el mapa y calcular qué tienes cerca.
      </p>
    </noscript>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <!-- Los módulos ES son diferidos: Leaflet ya está disponible cuando arranca. -->
    <script type="module" src="src/app/main.js"></script>
  </body>
</html>
